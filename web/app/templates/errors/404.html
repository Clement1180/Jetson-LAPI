<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page non trouvee</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .error-container { text-align: center; padding: 4rem 2rem; max-width: 500px; margin: 0 auto; }
        .error-code { font-size: 5rem; font-weight: 700; color: #64748b; margin: 0; }
        .error-msg { font-size: 1.2rem; color: #334155; margin: 1rem 0; }
        .error-link { display: inline-block; margin-top: 1.5rem; padding: 0.7rem 1.5rem; background: #2563eb; color: white; text-decoration: none; border-radius: 6px; }
        .error-link:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="error-container">
        <p class="error-code">404</p>
        <p class="error-msg">Cette page n'existe pas.</p>
        <a href="/" class="error-link">Retour a l'accueil</a>
    </div>
</body>
</html>
