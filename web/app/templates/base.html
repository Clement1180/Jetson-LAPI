<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}LAPI{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% block nav %}{% endblock %}
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <script>
  (function(){
    var token = document.cookie.split(';').map(function(c){return c.trim();}).find(function(c){return c.startsWith('csrf_token=');});
    if(token){
      token = token.split('=')[1];
      document.querySelectorAll('form[method="post"]').forEach(function(form){
        if(!form.querySelector('input[name="csrf_token"]')){
          var input = document.createElement('input');
          input.type='hidden'; input.name='csrf_token'; input.value=token;
          form.appendChild(input);
        }
      });
    }
  })();
  </script>
</body>
</html>
