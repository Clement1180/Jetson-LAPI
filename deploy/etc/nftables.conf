#!/usr/sbin/nft -f
# Firewall LAPI - NFR6: AUCUN port entrant ouvert
# Toute communication vers le cloud est sortante uniquement.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Loopback (necessaire pour MQTT local)
        iif "lo" accept

        # Connexions etablies/relatives (reponses a nos requetes sortantes)
        ct state established,related accept

        # ICMP (ping) - optionnel, utile pour le debug
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # SSH local uniquement (maintenance via cable serie ou reseau local direct)
        # Decommenter si besoin de maintenance SSH sur le reseau local:
        # tcp dport 22 ip saddr 192.168.0.0/16 accept

        # Tout le reste: DROP (pas de rejet pour ne pas reveler la presence)
        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;

        # Sortant: tout autoriser (MQTT cloud, NTP, DNS)
        # Le bridge Mosquitto gere les connexions sortantes vers le broker cloud
    }
}
