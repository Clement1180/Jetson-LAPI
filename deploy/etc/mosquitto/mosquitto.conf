# Mosquitto LAPI - Broker local embarqué
# Écoute UNIQUEMENT en local (NFR6: pas de port entrant)

listener 1883 127.0.0.1
protocol mqtt

# Pas d'accès anonyme
allow_anonymous false
password_file /etc/mosquitto/passwd

# Persistence pour survivre aux redémarrages
persistence true
persistence_location /var/lib/mosquitto/

# Logs
log_dest syslog
log_type error
log_type warning
log_type notice

# Limites
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 65536

# Inclure la config bridge vers le cloud
include_dir /etc/mosquitto/conf.d
