# Bridge MQTT vers le cloud (connexion SORTANTE uniquement - NFR6)
# Ce bridge relie le broker local au broker cloud de la plateforme web.
# Il souscrit aux topics whitelist du device et publie le status.

connection lapi-cloud
address mqtt.example.com:8883

# TLS (obligatoire en production)
bridge_cafile /etc/lapi/certs/ca.crt
bridge_certfile /etc/lapi/certs/client.crt
bridge_keyfile /etc/lapi/certs/client.key
bridge_tls_version tlsv1.2
bridge_protocol_version mqttv311

# Auth
remote_username __MQTT_USERNAME__
remote_password __MQTT_PASSWORD__

# Client ID unique par boîtier
remote_clientid __DEVICE_MQTT_ID__

# Topics bridgés:
# IN  (cloud -> local) : whitelist sync/add/remove
# OUT (local -> cloud) : status du boîtier

# Recevoir les commandes whitelist du cloud
topic whitelist/# in 1 lapi/ lapi/__DEVICE_MQTT_ID__/

# Recevoir les commandes OTA du cloud
topic ota/# in 1 lapi/ lapi/__DEVICE_MQTT_ID__/

# Recevoir les commandes d'ouverture distante (QR code fallback)
topic access/# in 1 lapi/ lapi/__DEVICE_MQTT_ID__/

# Publier le status vers le cloud
topic status out 1 lapi/ lapi/__DEVICE_MQTT_ID__/

# Publier les logs d'accès vers le cloud
topic access/log out 1 lapi/ lapi/__DEVICE_MQTT_ID__/

# Reconnexion automatique
restart_timeout 5 30
try_private true
notifications true
notification_topic lapi/__DEVICE_MQTT_ID__/bridge/state

# Démarrer même si le cloud est injoignable (NFR1: résilience réseau)
start_type automatic
bridge_attempt_unsubscribe true
